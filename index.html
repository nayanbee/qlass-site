<style>
:root { --ink:#121212; --ivory:#F2EEE6; --stone:#8C867C; --seat:#DBFF2A; --ring:rgba(242,238,230,.22); }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:var(--ink); color:var(--ivory); font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
main { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; padding:clamp(24px,5vw,56px) clamp(16px,6vw,80px); max-width:1100px; margin:0 auto; }
header { height:1px; }
.logo { height:clamp(104px,15vw,210px); width:auto; max-width:100%; color:var(--ivory); display:block; margin:0 auto; }
.logo .seat { fill:var(--seat); }
.hero { display:flex; flex-direction:column; align-items:center; padding:6vh 0; width:100%; }
h1 { font-family:"Inter Tight", Inter, sans-serif; font-weight:600; letter-spacing:-0.02em; line-height:1.1; font-size:clamp(24px,3vw,38px); margin-top:clamp(24px,3.5vw,44px); }
.dots { display:grid; grid-template-columns:repeat(18,1fr); gap:clamp(5px,0.9vw,11px); margin-top:clamp(24px,3.5vw,40px); width:min(100%,600px); }
.d { aspect-ratio:1; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--ring); animation:take .32s ease-out forwards; animation-delay:calc(var(--i) * 45ms + 300ms); }
.d:last-child { animation-name:take-last; }
@keyframes take { to { background:var(--ivory); box-shadow:none; } }
@keyframes take-last { to { background:var(--seat); box-shadow:none; } }
@media (prefers-reduced-motion: reduce) { .d { animation-duration:0s; animation-delay:0s; } }
footer { display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:center; align-items:baseline; font-size:14px; color:var(--stone); }
footer a { color:var(--ivory); text-decoration:none; border-bottom:1px solid var(--stone); padding-bottom:1px; }
footer a:hover { border-color:var(--seat); }
</style>
